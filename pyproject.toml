[project]
name = "imvbench"
version = "0.1.0"
description = "Fusion and imputation for neural classifiers on incomplete multi-view data: fusion types x imputers x missing rates"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.7.1,<2.9",      # CUDA 12.8 builds (CUDA 13 builds need recent GPU drivers)
    "numpy",
    "scipy",
    "scikit-learn",
    "optuna>=4.0",
    "pandas",
]

[project.scripts]
imvbench = "imvbench.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imvbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
